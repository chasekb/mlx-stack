services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ai-dev-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-dev-qdrant
    ports:
      - "6333:6333"
    profiles: ["optional"]

  rag:
    image: python:3.11-slim
    container_name: ai-dev-rag
    working_dir: /app
    volumes:
      - ./rag:/app
    command: ["python", "server.py"]
    ports:
      - "8090:8090"
    profiles: ["optional"]

  agent:
    image: python:3.11-slim
    container_name: ai-dev-agent
    working_dir: /app
    volumes:
      - ./:/app
    command: ["python", "-m", "agent.server"]
    ports:
      - "8091:8091"
    profiles: ["optional"]

  spec-router:
    image: python:3.11-slim
    container_name: ai-dev-spec-router
    working_dir: /app
    volumes:
      - ./spec_router:/app
    command: ["python", "server.py"]
    ports:
      - "8092:8092"
    profiles: ["optional"]

  embed-queue:
    image: python:3.11-slim
    container_name: ai-dev-embed-queue
    working_dir: /app
    volumes:
      - ./embedding_queue:/app
    command: ["python", "server.py"]
    ports:
      - "8093:8093"
    profiles: ["optional"]

  embed-worker:
    image: python:3.11-slim
    container_name: ai-dev-embed-worker
    working_dir: /app
    volumes:
      - ./embedding_worker:/app
      - ./.ai-dev:/app/.ai-dev
    environment:
      EMBED_URL: "http://litellm:4000/v1/embeddings"
      EMBED_MODEL: "local-embed"
      EMBED_SCHEMA_PATH: ".ai-dev/embedding_schema.json"
      EMBED_MIGRATION_LOG_PATH: ".ai-dev/embedding_migrations.jsonl"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "ai_dev_embeddings"
      QDRANT_ENABLED: "1"
      FORCE_FAKE_EMBED: "0"
      ALLOW_SCHEMA_MIGRATE: "0"
    command: ["python", "worker.py", "--queue-url", "http://embed-queue:8093", "--embed-url", "http://litellm:4000/v1/embeddings", "--embed-model", "local-embed", "--qdrant-url", "http://qdrant:6333", "--qdrant-collection", "ai_dev_embeddings"]
    depends_on:
      - embed-queue
      - litellm
      - qdrant
    profiles: ["optional"]
