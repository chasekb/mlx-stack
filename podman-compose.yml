version: '3.8'

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ai-dev-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-dev-qdrant
    ports:
      - "6333:6333"
    profiles: ["optional"]

  rag:
    image: python:3.11-slim
    container_name: ai-dev-rag
    working_dir: /app
    volumes:
      - ./rag:/app
    command: ["python", "server.py"]
    ports:
      - "8090:8090"
    profiles: ["optional"]

  agent:
    image: python:3.11-slim
    container_name: ai-dev-agent
    working_dir: /app
    volumes:
      - ./agent:/app
    command: ["python", "server.py"]
    ports:
      - "8091:8091"
    profiles: ["optional"]

  spec-router:
    image: python:3.11-slim
    container_name: ai-dev-spec-router
    working_dir: /app
    volumes:
      - ./spec_router:/app
    command: ["python", "server.py"]
    ports:
      - "8092:8092"
    profiles: ["optional"]

  embed-queue:
    image: python:3.11-slim
    container_name: ai-dev-embed-queue
    working_dir: /app
    volumes:
      - ./embedding_queue:/app
    command: ["python", "server.py"]
    ports:
      - "8093:8093"
    profiles: ["optional"]

  embed-worker:
    image: python:3.11-slim
    container_name: ai-dev-embed-worker
    working_dir: /app
    volumes:
      - ./embedding_worker:/app
      - ./embedding_queue:/queue
    command: ["python", "worker.py", "--queue-url", "http://embed-queue:8093"]
    depends_on:
      - embed-queue
    profiles: ["optional"]
